<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>CA Skontaktuj się z nami</title>
  </head>
  <body>
    <header>
      <h1>Skontaktuj się z nami</h1>
    </header>

    <nav>
      <a
        href="./index.html"
        target="_self"
        title="Strona główna (katalog produktów)"
        >Katalog</a
      >
      <a
        href="./produkt.html"
        target="_self"
        title="Przejdź na przykładową stronę produktu"
        >Przykładowy produkt</a
      >
      <a href="./kontakt.html" aria-current="page" title="Tu jesteś">Kontakt</a>
    </nav>

    <main>
      <section>
        <h2>Zapytanie o produkt</h2>

        <form method="get" action="kontakt.html">
          <label for="email">Adres e-mail (wymagane):</label>
          <input type="email" id="email" name="email" required />

          <label for="produkt">Produkt (wymagane):</label>
          <select id="produkt" name="produkt" required>
            <option value="">Wybierz produkt</option>
            <option value="produkt1">Audio-Technica ATH-M40x</option>
            <option value="produkt2">Fiio Snowsky Echo Mini</option>
            <option value="produkt3">Koss PortaPro</option>
          </select>

          <label for="ilosc">Liczba sztuk (wymagane, od 1 do 5):</label>
          <input
            type="number"
            id="ilosc"
            name="ilosc"
            required
            min="1"
            max="5"
            step="1"
          />

          <label for="wiadomosc"
            >Wiadomość (wymagane, od 10 do 500 znaków):</label
          >
          <textarea
            id="wiadomosc"
            name="wiadomosc"
            required
            minlength="10"
            maxlength="500"
          ></textarea>

          <p>
            Formularz demonstracyjny. Dane pojawią się w adresie strony;
            zapytanie nie zostanie zapisane ani wysłane e-mailem
          </p>

          <button type="submit">Sprawdź zapytanie</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Dariusz Tylza</p>
    </footer>
  </body>
</html>
